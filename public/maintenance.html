<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance – Lead Sync</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 480px;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f8fafc;
    }

    p {
      font-size: 16px;
      color: #94a3b8;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      margin-top: 28px;
      padding: 8px 20px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 999px;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">🔧</div>
    <h1>We'll be back shortly</h1>
    <p>Lead Sync is currently undergoing scheduled maintenance. We apologize for the inconvenience and appreciate your
      patience.</p>
    <div class="badge">Estimated downtime: ~2 hour</div>
  </div>
</body>

</html>
